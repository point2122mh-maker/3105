name: build-3105

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply stealth UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ui = Path("ThreeOneOSFive/helpers/AppTabNavigationState.swift")
          s = ui.read_text()
          old = "        case .files:\n            return developerModeEnabled\n        default:\n            return true\n"
          new = "        case .home, .installed:\n            return true\n        case .files:\n            return developerModeEnabled\n        case .new, .sources, .search:\n            return false\n"
          assert old in s, "tab visibility pattern not found"
          ui.write_text(s.replace(old, new, 1))

          p = Path("ThreeOneOSFive/helpers/PackageRepositoryStore.swift")
          s = p.read_text()
          marker = '    private static let storageKey = "repository.sources.v1"'
          assert marker in s, "storage key marker not found"
          s = s.replace(marker, "    private static let hideRepositoryContent = true\n\n" + marker, 1)

          old = "        if let data = defaults.data(forKey: Self.storageKey),\n           let decoded = try? JSONDecoder().decode([RepositorySource].self, from: data) {\n"
          new = "        if !Self.hideRepositoryContent,\n           let data = defaults.data(forKey: Self.storageKey),\n           let decoded = try? JSONDecoder().decode([RepositorySource].self, from: data) {\n"
          assert old in s, "init sources pattern not found"
          s = s.replace(old, new, 1)

          old = "    var packages: [RepositoryPackageRecord] {\n        sources.flatMap"
          new = "    var packages: [RepositoryPackageRecord] {\n        guard !Self.hideRepositoryContent else { return [] }\n        return sources.flatMap"
          assert old in s, "packages pattern not found"
          s = s.replace(old, new, 1)

          for sig, ins in [
              ("    func refreshAllIfNeeded() {\n", "        guard !Self.hideRepositoryContent else { return }\n"),
              ("    func refreshAll() {\n", "        guard !Self.hideRepositoryContent else { return }\n"),
              ("    func refreshAllAndWait() async {\n", "        guard !Self.hideRepositoryContent else { return }\n"),
              ("    func refresh(_ source: RepositorySource) {\n", "        guard !Self.hideRepositoryContent else { return }\n"),
              ("    func addSource(rawURL: String) -> Bool {\n", "        guard !Self.hideRepositoryContent else { return false }\n"),
          ]:
              assert sig in s, sig
              s = s.replace(sig, sig + ins, 1)

          old = "#if targetEnvironment(simulator)\n        if ProcessInfo.processInfo.arguments.contains"
          new = "#if targetEnvironment(simulator)\n        guard !Self.hideRepositoryContent else { return }\n        if ProcessInfo.processInfo.arguments.contains"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          print("stealth UI patch applied")
          PY

      - name: Build unsigned IPA
        run: |
          sed '/^BUILD_ROOT=/,$d' build_3105.sh > .patch_only.sh
          bash .patch_only.sh .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ThreeOneOSFive/ContentView.swift")
          s = p.read_text()
          old = "        fileURLs = (try? FileManager.default.contentsOfDirectory(\n            at: folderURL,\n            includingPropertiesForKeys: nil,\n            options: [.skipsHiddenFiles]\n        )) ?? []\n"
          new = "        var found: [URL] = []\n        let bundleDir = Bundle.main.bundleURL\n            .appendingPathComponent(\"Injected\", isDirectory: true)\n            .appendingPathComponent(title, isDirectory: true)\n        if let bundled = try? FileManager.default.contentsOfDirectory(\n            at: bundleDir,\n            includingPropertiesForKeys: nil,\n            options: [.skipsHiddenFiles]\n        ) { found.append(contentsOf: bundled) }\n        if let local = try? FileManager.default.contentsOfDirectory(\n            at: folderURL,\n            includingPropertiesForKeys: nil,\n            options: [.skipsHiddenFiles]\n        ) { found.append(contentsOf: local) }\n        fileURLs = found\n"
          assert old in s, "category reload pattern not found"
          p.write_text(s.replace(old, new, 1))
          print("bundle injection wired")
          PY
          xcodebuild -project ThreeOneOSFive.xcodeproj -target 3105 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' SYMROOT=.build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP="$(find .build/Release-iphoneos -maxdepth 1 -name '3105.app' -print -quit)"
          test -n "$APP"
          for C in HOLOGRAM SKIN MISC; do
            mkdir -p "$APP/Injected/$C"
            if [ -d "injected/$C" ]; then cp -R "injected/$C/." "$APP/Injected/$C/" 2>/dev/null || true; fi
          done
          mkdir -p .stage/Payload
          cp -R "$APP" .stage/Payload/3105.app
          (cd .stage && zip -qry "$GITHUB_WORKSPACE/3105-unsigned.ipa" Payload)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
          if-no-files-found: error

      - name: Publish release with direct IPA download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ipa-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$TAG" 3105-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "3105 unsigned IPA - stealth ($TAG)" \
            --notes "Sources, New and Search tabs hidden. Unsigned IPA - requires enterprise certificate signing."
