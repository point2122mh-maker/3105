name: build-3105

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash build_3105.sh . 3105-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
          if-no-files-found: error

      - name: Publish release with direct IPA download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ipa-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$TAG" 3105-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "3105 unsigned IPA ($TAG)" \
            --notes "Unofficial build from source. Unsigned IPA - requires enterprise certificate signing."
