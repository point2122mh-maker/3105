name: build-3105

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build unsigned IPA
        run: bash build_3105.sh . 3105-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
          if-no-files-found: error
